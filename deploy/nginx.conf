# ============================================================
# Strata — nginx 反向代理配置
# 位置：/etc/nginx/sites-available/strata
# 启用：sudo ln -s /etc/nginx/sites-available/strata \
#                   /etc/nginx/sites-enabled/strata
# ============================================================
#
# 功能：
#   1. HTTP (80) → 自动重定向到 HTTPS (443)
#   2. HTTPS (443) → 前端静态文件 + 后端 API 反向代理
#   3. WebSocket /ws/* → 后端 uvicorn（保持长连接）
#   4. 上传文件大小限制 25MB（比后端 20MB 宽松一点）
#   5. Gzip 压缩静态资源
#   6. 安全响应头
# ============================================================

# 上游：uvicorn 后端进程
upstream strata_backend {
    server 127.0.0.1:8000;
    keepalive 32;               # 保持连接池，减少握手开销
}

# ── HTTP → HTTPS 重定向 ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;    # ← 替换为你的域名，如 strata.example.com

    # Let's Encrypt 证书续签验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务 ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;    # ← 替换为你的域名

    # ── SSL 证书（certbot 自动生成）──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # SSL 安全配置
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;

    # ── 请求限制 ─────────────────────────────────────────────
    client_max_body_size 25M;   # 文件上传上限（比后端 20M 宽松 5M）
    client_body_timeout  60s;

    # ── Gzip 压缩 ────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/x-javascript text/xml application/xml
        image/svg+xml font/woff2;

    # ── 安全响应头 ───────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── WebSocket 反向代理 /ws/* ─────────────────────────────
    # 必须在 /api/ 和 / 之前匹配，否则会被静态文件规则拦截
    location /ws/ {
        proxy_pass         http://strata_backend;
        proxy_http_version 1.1;

        # WebSocket 升级头（缺少则握手失败）
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # 传递真实客户端信息
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 超时：前端每 30s ping，这里设 90s 不会超时
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
        proxy_connect_timeout 10s;
    }

    # ── REST API 反向代理 /api/* ─────────────────────────────
    location /api/ {
        proxy_pass         http://strata_backend;
        proxy_http_version 1.1;

        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;    # 文件解析 / LLM 首 token 可能较慢
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # 禁止缓存 API 响应
        proxy_no_cache      1;
        proxy_cache_bypass  1;
    }

    # ── 前端静态文件 / ───────────────────────────────────────
    # nginx 直接托管 Vite build 产物，不经过 uvicorn
    location / {
        root  /home/strata/Strata_v6/frontend/dist;   # ← Vite build 输出目录
        index index.html;

        # SPA 路由支持：所有路径回退到 index.html
        try_files $uri $uri/ /index.html;

        # 静态资源长期缓存（Vite 产物文件名含 hash，安全）
        location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|ico|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 文件不缓存（保证刷新后能拿到最新版本）
        location ~* \.html$ {
            expires    0;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── 屏蔽隐藏文件访问 ─────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
